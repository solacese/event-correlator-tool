# SAM Go configuration for the post-trade reconciliation correlator.
# This file is referenced by the AWE process and declares the correlator
# as a first-class instance kind alongside agents and workflows.

apps:
  - name: trade_correlator
    app_config:
      kind: correlator
      namespace: solace-agent-mesh

      # Postgres connection (shared with SAM session store).
      session_service:
        database_url: ${DATABASE_URL, postgres://sam:sam@localhost:5432/sam?sslmode=disable}

      # Source systems publishing trade events.
      sources:
        - name: solar
          topic: "bbva/trades/solar/>"
        - name: murex
          topic: "bbva/trades/murex/>"
        - name: client_reporting
          topic: "bbva/trades/client_reporting/>"

      # All sources that must confirm for reconciliation.
      expected_sources: [solar, murex, client_reporting]

      # How long to wait for all sources before declaring a break.
      correlation_window: 5m

      # How often the sweep checks for expired trades.
      sweep_interval: 30s

      # Durable queue name prefix (supports competing consumers).
      queue_prefix: bbva-recon

      # Output topics.
      output:
        reconciled_topic: "bbva/reconciliation/matched"
        break_topic: "bbva/reconciliation/breaks"
        workflow_trigger_topic: "solace-agent-mesh/a2a/v1/break_investigation/request"
