# Standalone correlator configuration (for running outside SAM).
# Use config/sam-correlator.yaml for SAM Go AWE deployment.

correlator:
  queue_prefix: recon

  sources:
    - name: source_a
      topic: "trades/source_a/>"
    - name: source_b
      topic: "trades/source_b/>"
    - name: source_c
      topic: "trades/source_c/>"

  expected_sources:
    - source_a
    - source_b
    - source_c

  timing:
    correlation_window: 5m
    sweep_interval: 30s

  output:
    reconciled_topic: "reconciliation/matched"
    break_topic: "reconciliation/breaks"
